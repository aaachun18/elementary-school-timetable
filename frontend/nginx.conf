server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes like /scheduler have no file on disk,
    # so serve index.html and let React Router handle them (otherwise a
    # page refresh on /scheduler returns 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
