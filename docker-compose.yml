services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # backend/frontend only start with `--profile full` (see README「用 Docker
  # 一次啟動全部服務」), so plain `docker compose up -d` still starts only
  # PostgreSQL for the local dev flow (venv + uvicorn + npm run dev).
  backend:
    profiles: ["full"]
    build:
      # Repo root, not backend/: the image also needs scheduling_engine/
      # and alembic.ini.
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL (localhost:5433, for the local dev
      # flow): inside the compose network the DB is service `postgres` on
      # its container port 5432. Credentials still come from .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      # Must stay 5173: the backend's CORS allows only http://localhost:5173.
      - "5173:80"

volumes:
  postgres_data:
